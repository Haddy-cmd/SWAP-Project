; Upload limits for the SWAP API (production).
;
; The portal accepts documents up to 5 MB (application documents, COR, promissory
; notes; see the `max:5120` rules). PHP's built-in default is only 2 MB, which made
; larger files fail before Laravel saw them. Leave headroom for the multipart overhead.
upload_max_filesize=10M
post_max_size=12M
